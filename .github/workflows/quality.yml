name: Quality

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ui.txt
            requirements-skills.txt
            requirements-dev.txt

      - name: Create virtual environment
        shell: pwsh
        run: py -3.12 -m venv .venv

      - name: Install development dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Run unit tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m coverage run --source=src,core -m unittest discover -s tests -v

      - name: Publish coverage summary
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m coverage report --show-missing

      - name: Compile Python sources
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m compileall -q src core skills main.pyw tests

      - name: Check module sizes
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts/check_module_sizes.py

      - name: Check Git diff
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$env:BASE_SHA" HEAD
